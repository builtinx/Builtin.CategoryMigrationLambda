name: "Copilot Setup Steps"

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          source-url: https://nuget.pkg.github.com/builtinx/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GH_PAT_REPO }}

      - name: Restore NuGet dependencies
        run: dotnet restore CategoryMigrationLambda.sln
